name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # Permite rodar manualmente pela aba "Actions".
  workflow_dispatch:
  # Chamado pela revisão automática depois do commit dos dados novos
  # (push feito pelo token do Actions não dispara este workflow sozinho).
  workflow_call:
    inputs:
      ref:
        description: Commit a publicar
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

# Só um deploy por vez; um deploy em andamento não é cancelado.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - uses: actions/configure-pages@v5
        id: pages

      # O site fica em https://<usuario>.github.io/<repositorio>/; o build precisa saber esse caminho.
      - name: Build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
