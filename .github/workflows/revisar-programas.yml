name: Revisão dos programas com IA

# Confere valores, regras e fontes de todos os programas, procura programas novos
# e faz o commit dos dados atualizados direto na main, publicando o site em seguida.
# O commit só acontece se lint, testes e build passarem com os dados novos.

on:
  schedule:
    # Dia 1 de cada mês, 7h no horário de Brasília (10h UTC).
    - cron: '0 10 1 * *'
  workflow_dispatch:
    inputs:
      modo:
        description: O que revisar
        type: choice
        default: tudo
        options: [tudo, revisar, novos, referencias, gastos]
      programas:
        description: Ids dos programas, separados por vírgula (vazio = todos)
        required: false
        default: ''
      ufs:
        description: Siglas dos estados, separadas por vírgula (vazio = todos)
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: revisao-programas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Revisar com IA
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Entradas passam por variáveis de ambiente, nunca direto no comando.
          MODO: ${{ inputs.modo || 'tudo' }}
          PROGRAMAS: ${{ inputs.programas }}
          UFS: ${{ inputs.ufs }}
        run: npm run revisar -- --modo "$MODO" --programas "$PROGRAMAS" --ufs "$UFS"

      - name: Mostrar o relatório no resumo da execução
        if: always()
        run: |
          if [ -f .revisao/relatorio.md ]; then cat .revisao/relatorio.md >> "$GITHUB_STEP_SUMMARY"; fi

      # Trava de segurança: com dados que quebram o site, nada é gravado.
      - name: Lint, testes e build com os dados novos
        run: npm run lint && npm test && npm run build

      - name: Commit na main
        id: commit
        run: |
          if git diff --quiet -- src/dados; then
            echo "Nenhum dado mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/dados/*.json
          {
            echo "Atualiza dados dos programas (revisão automática)"
            echo
            head -c 60000 .revisao/relatorio.md
          } > /tmp/mensagem.txt
          git commit -F /tmp/mensagem.txt
          # Se a main andou durante a revisão, aplica o commit por cima.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publicar:
    needs: revisar
    if: needs.revisar.outputs.commit != ''
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.revisar.outputs.commit }}
